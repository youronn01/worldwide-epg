
name: Update Worldwide EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r worldwide-epg/requirements.txt

      - name: Merge worldwide EPG
        run: python worldwide-epg/merge.py

      - name: Add IPTV-org channel ID aliases
        run: python worldwide-epg/add_playlist_aliases.py

      - name: Merge verified external EPG guides
        run: python worldwide-epg/merge_extra_guides.py


      - name: Audit worldwide EPG coverage
        run: python worldwide-epg/coverage_audit.py

      - name: Discover worldwide EPG providers
        run: python worldwide-epg/source_discovery.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: worldwide-coverage-report
          path: coverage-reports/

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p public
          echo "Searching for generated EPG files..."
          find . -type f \( -name "epg.xml" -o -name "epg.xml.gz" \)

          EPG_FILE=$(find . -type f -name "epg.xml.gz" -print -quit)

          if [ -n "$EPG_FILE" ]; then
            cp "$EPG_FILE" public/epg.xml.gz
          else
            XML_FILE=$(find . -type f -name "epg.xml" -print -quit)
            if [ -n "$XML_FILE" ]; then
              gzip -c "$XML_FILE" > public/epg.xml.gz
            else
              echo "ERROR: No EPG XML file was generated."
              exit 1
            fi
          fi

          touch public/.nojekyll
          ls -lh public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
