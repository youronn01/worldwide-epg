
name: Discover Maximum Worldwide EPG Matches

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maximize-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml

      - name: Check matching script exists
        run: |
          test -f worldwide-epg/maximize_matches.py

      - name: Discover worldwide EPG matches
        run: |
          python -u worldwide-epg/maximize_matches.py

      - name: Upload matching reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maximum-epg-match-reports
          path: max-match-reports/
          if-no-files-found: warn
          retention-days: 30
