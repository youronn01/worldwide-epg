
name: Validate Worldwide EPG Schedule Matches

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install lxml

      - name: Validate EPGShare01 schedules
        run: python -u worldwide-epg/validate_schedule_matches.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldwide-schedule-validation
          path: schedule-validation-reports/
          if-no-files-found: warn
          retention-days: 30
