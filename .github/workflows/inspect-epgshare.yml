
name: Inspect EPGShare01 Worldwide

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install lxml

      - name: Generate worldwide matching report
        run: python worldwide-epg/inspect_epgshare.py

      - name: Upload matching reports
        uses: actions/upload-artifact@v4
        with:
          name: epgshare-worldwide-matching-report
          path: epgshare-reports/
