
name: Test IPTV-org EPG

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out IPTV-org EPG
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Create small channel list
        run: |
          
      - name: Create small channel list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path(
              'sites/epg.iptvx.one/epg.iptvx.one.channels.xml'
          )
          if not source.exists():
              raise SystemExit(f'Source configuration missing: {source}')

          root = ET.parse(source).getroot()
          candidates = [
              channel for channel in root.findall('channel')
              if channel.get('xmltv_id')
              and channel.get('site_id')
          ]

          if not candidates:
              raise SystemExit('No usable source channel mappings found')

          selected = candidates[:10]
          output = ET.Element('channels')
          for channel in selected:
              output.append(channel)

          ET.ElementTree(output).write(
              'test.channels.xml',
              encoding='utf-8',
              xml_declaration=True
          )
          print(f'Selected {len(selected)} real source mappings')
          for channel in selected:
              print(channel.get('xmltv_id'), channel.get('site_id'))
          PY


      - name: Generate small test guide
        run: |
          timeout 600s npm run grab -- \
            --channels=test.channels.xml \
            --output=guide.xml \
            --days=1

      - name: Check generated guide
        if: always()
        run: |
          if [ -f guide.xml ]; then
            ls -lh guide.xml
            head -c 300 guide.xml
          else
            echo "No guide generated"
          fi

      - name: Upload generated guide
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-org-test-epg
          path: guide.xml
          if-no-files-found: warn
