
name: Test IPTV-org EPG

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out IPTV-org EPG
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate test XMLTV guide
        run: npm run grab -- --sites=epg.iptvx.one --output=guide.xml

      - name: Upload generated EPG
        uses: actions/upload-artifact@v4
        with:
          name: iptv-org-test-epg
          path: guide.xml
          if-no-files-found: error
