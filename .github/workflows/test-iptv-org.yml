
name: Test IPTV-org EPG

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out IPTV-org EPG
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Create small channel list
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.Element('channels')
          for channel_id in [
              'BBCOne.uk',
              'BBCNews.uk',
              'CNN.us',
              'DiscoveryChannel.us',
              'NationalGeographic.us'
          ]:
              ET.SubElement(root, 'channel', {
                  'site': 'epg.iptvx.one',
                  'site_id': channel_id,
                  'lang': 'en',
                  'xmltv_id': channel_id
              }).text = channel_id

          ET.ElementTree(root).write(
              'test.channels.xml',
              encoding='utf-8',
              xml_declaration=True
          )
          PY

      - name: Generate small test guide
        run: |
          timeout 600s npm run grab -- \
            --channels=test.channels.xml \
            --output=guide.xml \
            --days=1

      - name: Check generated guide
        if: always()
        run: |
          if [ -f guide.xml ]; then
            ls -lh guide.xml
            head -c 300 guide.xml
          else
            echo "No guide generated"
          fi

      - name: Upload generated guide
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-org-test-epg
          path: guide.xml
          if-no-files-found: warn
