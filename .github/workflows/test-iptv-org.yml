
name: Test IPTV-org EPG

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out IPTV-org EPG
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate small test guide
        run: |
          timeout 600s npm run grab -- --sites=epg.iptvx.one --limit=20 --output=guide.xml

      - name: Check generated guide
        if: always()
        run: |
          if [ -f guide.xml ]; then
            ls -lh guide.xml
            head -c 300 guide.xml
          else
            echo "No guide generated"
          fi

      - name: Upload generated guide
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-org-test-epg
          path: guide.xml
          if-no-files-found: warn
